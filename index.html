<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List - Executive Dashboard</title>

  <!-- Modern Libraries -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>

  <!-- DataTables -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css">
  <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>

  <style>
    :root {
      --primary: #556b2f;
      --primary-light: #6b8e23;
      --secondary: #3a7ca5;
      --secondary-dark: #2c5985;
      --accent: #ff6b6b;
      --light-bg: #f8f9fa;
      --dark-text: #212529;
      --gray-text: #6c757d;
      --success: #28a745;
      --warning: #ffc107;
      --danger: #dc3545;
      --card-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      --transition: all 0.3s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Kanit', sans-serif;
      background-color: #f5f7f9;
      color: var(--dark-text);
      line-height: 1.6;
    }

    .app-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header Styles */
    .app-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--card-shadow);
      color: white;
    }

    .app-logo {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .app-logo img {
      height: 60px;
      border-radius: 50%;
      background: white;
      padding: 2px;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.5));
    }

    .app-title {
      font-weight: 600;
      font-size: 24px;
      margin: 0;
    }

    .task-counter {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 5px 15px;
      font-weight: 500;
    }

    /* Form Styles */
    .form-container {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--card-shadow);
      margin-bottom: 24px;
    }

    .form-title {
      font-weight: 600;
      margin-bottom: 20px;
      color: var(--primary);
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-title i {
      font-size: 22px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-control, .form-select {
      border-radius: 10px;
      padding: 12px 16px;
      border: 1px solid #e1e5eb;
      transition: var(--transition);
    }

    .form-control:focus, .form-select:focus {
      border-color: var(--secondary);
      box-shadow: 0 0 0 0.25rem rgba(58, 124, 165, 0.25);
    }

    .file-upload-container {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .custom-file-upload {
      background-color: var(--secondary);
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      transition: var(--transition);
      font-weight: 500;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0;
    }

    .custom-file-upload:hover {
      background-color: var(--secondary-dark);
      transform: translateY(-2px);
    }

    .file-name {
      color: var(--gray-text);
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 180px;
    }

    .submit-btn {
      background: linear-gradient(135deg, var(--secondary) 0%, var(--secondary-dark) 100%);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-weight: 500;
      width: 100%;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(58, 124, 165, 0.3);
      color: white;
    }

    /* Filter Section */
    .filter-container {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--card-shadow);
    }

    .filter-title {
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--primary);
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .calendar-container {
      margin-bottom: 16px;
      display: flex;
      justify-content: center;
    }

    .show-all-btn {
      background-color: var(--light-bg);
      color: var(--dark-text);
      border: 1px solid #e1e5eb;
      border-radius: 10px;
      padding: 10px 20px;
      font-weight: 500;
      width: 100%;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .show-all-btn:hover {
      background-color: #e9ecef;
    }

    /* Table Styles */
    .table-container {
      background: white;
      border-radius: 16px;
      box-shadow: var(--card-shadow);
      overflow: hidden;
      padding: 24px;
      width: 100% !important;
      max-width: 100% !important;
      position: relative;
    }

    /* Custom DataTable Styling */
    .dataTables_wrapper { width: 100% !important; }
    .dataTables_wrapper .dataTables_length { margin-bottom: 20px; }
    .dataTables_wrapper .dataTables_filter { margin-bottom: 20px; }
    .dataTables_wrapper .dataTables_filter input {
      border-radius: 25px; padding: 8px 15px; border: 1px solid #e1e5eb;
    }
    .dataTables_wrapper .dataTables_paginate,
    .dataTables_wrapper .dataTables_info,
    .dataTables_wrapper .dataTables_length,
    .dataTables_wrapper .dataTables_filter { width: 100% !important; }
    .dataTables_wrapper .dataTables_paginate { text-align: center !important; white-space: nowrap !important; }
    .dataTables_wrapper .dataTables_info { white-space: nowrap !important; color: var(--gray-text); font-size: 14px; }

    #todoTable { width: 100% !important; table-layout: fixed !important; }
    #todoTable_wrapper { width: 100% !important; }

    /* กำหนดความกว้างคอลัมภ์ */
    #todoTable thead th:nth-child(1), #todoTable tbody td:nth-child(1) { width: 30px !important; }
    #todoTable thead th:nth-child(2), #todoTable tbody td:nth-child(2) { width: 100px !important; }
    #todoTable thead th:nth-child(3), #todoTable tbody td:nth-child(3) { width: 80px !important; }
    #todoTable thead th:nth-child(4), #todoTable tbody td:nth-child(4) { 
      width: 60% !important; word-wrap: break-word !important; white-space: normal !important; overflow-wrap: break-word !important; max-width: 400px !important; 
    }
    #todoTable thead th:nth-child(5), #todoTable tbody td:nth-child(5) { width: 100px !important; }
    #todoTable thead th:nth-child(6), #todoTable tbody td:nth-child(6) { width: 80px !important; }
    #todoTable thead th:nth-child(7), #todoTable tbody td:nth-child(7) { width: 60px !important; }
    #todoTable thead th:nth-child(8), #todoTable tbody td:nth-child(8) { width: 80px !important; text-align: center; }

    .custom-thead {
      background: linear-gradient(135deg, var(--secondary) 0%, var(--secondary-dark) 100%);
      color: white;
    }
    .custom-thead th { padding: 16px 12px; font-weight: 500; text-align: left; }
    .custom-table td { padding: 16px 12px; vertical-align: middle; border-bottom: 1px solid #e1e5eb; }
    .custom-table tr { transition: var(--transition); }
    .custom-table tr:hover { background-color: rgba(58, 124, 165, 0.05); }

    .table-responsive { width: 100% !important; overflow-x: auto !important; }

    /* Badge Styles */
    .status-badge {
      padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: 500;
      cursor: pointer; transition: var(--transition); display: inline-block;
      min-width: 100px; text-align: center;
    }
    .status-no { background-color: rgba(255, 193, 7, 0.2); color: #856404; }
    .status-yes { background-color: rgba(40, 167, 69, 0.2); color: #155724; }

    .priority-badge {
      padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: 500;
      display: inline-block; min-width: 60px; text-align: center;
    }
    .priority-high { background-color: rgba(220, 53, 69, 0.2); color: #721c24; }
    .priority-medium { background-color: rgba(255, 193, 7, 0.2); color: #856404; }
    .priority-low { background-color: rgba(40, 167, 69, 0.2); color: #155724; }

    /* Action Buttons */
    .action-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 36px; height: 36px; border-radius: 50%; transition: var(--transition);
      cursor: pointer; text-decoration: none; margin: 0 2px; border: none; font-size: 16px;
    }
    .file-btn { background-color: rgba(58, 124, 165, 0.1); color: var(--secondary); }
    .file-btn:hover { background-color: rgba(58, 124, 165, 0.2); color: var(--secondary); }
    .edit-btn { background-color: rgba(255, 193, 7, 0.1); color: #ffc107; }
    .edit-btn:hover { background-color: rgba(255, 193, 7, 0.2); color: #ffc107; }
    .delete-btn { background-color: rgba(220, 53, 69, 0.1); color: var(--danger); }
    .delete-btn:hover { background-color: rgba(220, 53, 69, 0.2); color: var(--danger); }

    /* Child Row Content */
    .child-row-content {
      background: #f8f9fa; border-radius: 8px; padding: 15px; margin: 10px 0;
      border-left: 4px solid var(--secondary); animation: slideDown 0.3s ease-out;
      width: 100%; box-sizing: border-box;
    }
    .child-row-item {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; padding: 8px 0; border-bottom: 1px solid #e9ecef;
    }
    .child-row-item:last-child { border-bottom: none; margin-bottom: 0; }
    .child-row-label { font-weight: 600; color: var(--gray-text); min-width: 100px; font-size: 14px; }
    .child-row-value { flex: 1; text-align: right; }
    .child-actions {
      display: flex; gap: 8px; justify-content: center;
      margin-top: 15px; padding-top: 15px; border-top: 1px solid #e9ecef;
    }

    /* Modal Styles */
    .modal-content { border-radius: 16px; border: none; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); }
    .modal-header { border-bottom: 1px solid #e1e5eb; padding: 20px 24px; }
    .modal-title { color: var(--primary); font-weight: 600; }
    .modal-body { padding: 24px; }
    .modal-footer { border-top: 1px solid #e1e5eb; padding: 20px 24px; }

    /* DataTables Custom Styles */
    .dataTables_wrapper .dataTables_paginate .paginate_button {
      padding: 0.375rem 0.75rem; margin: 0 2px; border-radius: 0.25rem;
      border: 1px solid #dee2e6; background: white; color: var(--secondary);
    }
    .dataTables_wrapper .dataTables_paginate .paginate_button:hover,
    .dataTables_wrapper .dataTables_paginate .paginate_button.current {
      background: var(--secondary) !important; color: white !important; border-color: var(--secondary) !important;
    }

    /* Datepicker Custom Styles */
    .ui-datepicker { font-family: 'Kanit', sans-serif; font-size: 16px; width: 315px; margin: 0 auto; border: none; }
    .ui-datepicker-header { font-size: 18px; padding: 8px 0; background: transparent; border: none; color: var(--primary); }
    .ui-datepicker th { font-weight: bold; font-size: 14px; padding: 6px; color: var(--gray-text); }
    .ui-datepicker td { padding: 3px; position: relative; }
    .ui-datepicker td a { text-align: center; display: block; padding: 8px; font-size: 14px; border-radius: 8px; background: transparent; border: none; color: var(--dark-text); font-weight: 500; }
    .ui-datepicker td a:hover { background: rgba(55, 107, 47, 0.1); color: var(--primary); }
    .ui-datepicker td a.ui-state-active { background: var(--primary); color: white; }
    
    .ui-datepicker td.has-data a:after {
      content: ''; position: absolute; top: 2px; right: 2px; width: 6px; height: 6px;
      background-color: #28a745; border-radius: 50%; z-index: 10;
    }

    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    /* Mobile Responsive Styles */
    @media screen and (max-width: 767px) {
      #todoTable thead th:not(:nth-child(1)):not(:nth-child(2)):not(:nth-child(3)),
      #todoTable tbody td:not(:nth-child(1)):not(:nth-child(2)):not(:nth-child(3)) { display: none !important; }
      #todoTable thead th:nth-child(1), #todoTable tbody td:nth-child(1) { display: table-cell !important; width: 30px !important; }

      .dtr-control {
        display: table-cell !important; width: 30px !important; padding: 8px 4px !important;
        text-align: center !important; vertical-align: middle !important; cursor: pointer !important;
        user-select: none !important; position: relative !important;
      }
      .dtr-control:before {
        content: '\2295' !important; display: inline-block !important; color: var(--secondary) !important;
        font-weight: bold !important; font-size: 18px !important; text-align: center !important;
        width: 22px !important; height: 22px !important; line-height: 22px !important; border-radius: 50% !important;
        background-color: rgba(58, 124, 165, 0.1) !important; border: 1px solid rgba(58, 124, 165, 0.3) !important;
        transition: all 0.3s ease !important;
      }
      .dtr-control:hover:before { background-color: rgba(58, 124, 165, 0.2) !important; transform: scale(1.1) !important; }
      .dtr-control.parent:before {
        content: '\2296' !important; color: var(--danger) !important;
        background-color: rgba(220, 53, 69, 0.1) !important; border-color: rgba(220, 53, 69, 0.3) !important;
      }
      
      tr.child { width: 100% !important; display: table-row !important; }
      tr.child td { width: 100% !important; padding: 0 !important; border: none !important; display: table-cell !important; colspan: 3 !important; }
      tr.child ul.dtr-details { display: none !important; }
      .child-row-content { width: 100% !important; margin: 0 !important; padding: 20px 15px !important; border-radius: 0 !important; box-sizing: border-box !important; background: #f8f9fa !important; border-left: 4px solid var(--secondary) !important; }
      
      #todoTable thead th:nth-child(1) { width: 30px !important; }
      #todoTable thead th:nth-child(2) { width: 45% !important; }
      #todoTable thead th:nth-child(3) { width: 25% !important; }
      #todoTable tbody td:nth-child(1) { width: 30px !important; }
      #todoTable tbody td:nth-child(2) { width: 45% !important; }
      #todoTable tbody td:nth-child(3) { width: 25% !important; }
    }

    @media screen and (min-width: 768px) {
      .dtr-control-header, .dtr-control { display: none !important; }
      #todoTable thead th:first-child, #todoTable tbody td:first-child { display: none !important; }
    }

    @media (max-width: 992px) {
      .app-header { flex-direction: column; text-align: center; gap: 15px; }
      .app-logo { justify-content: center; flex-direction: column; gap: 10px; }
      .app-logo img { height: 50px; }
      .app-title { font-size: 20px; }
    }
    @media (max-width: 768px) {
      .app-container { padding: 15px; }
      .table-container, .form-container, .filter-container { padding: 16px; }
    }
    @media (max-width: 576px) {
      .app-header { padding: 15px; }
      .app-logo { gap: 8px; }
      .app-logo img { height: 40px; }
      .app-title { font-size: 18px; }
    }

    #todoTable.dataTable th:nth-child(4), #todoTable.dataTable td:nth-child(4) { width: 60% !important; min-width: 300px !important; max-width: 400px !important; word-wrap: break-word !important; white-space: normal !important; overflow-wrap: break-word !important; }
    #todoTable.dataTable { table-layout: fixed !important; width: 100% !important; }
    .dataTables_wrapper .dataTable th:nth-child(4), .dataTables_wrapper .dataTable td:nth-child(4) { width: 60% !important; min-width: 300px !important; max-width: 400px !important; }
    .dataTable th, .dataTable td { box-sizing: border-box !important; }

    /* Loading Overlay for Table */
    .loading-spinner {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(4px);
      z-index: 10; display: none; flex-direction: column; justify-content: center; align-items: center; border-radius: 16px;
    }
    .spinner-border { color: var(--secondary); width: 3rem; height: 3rem; }
  </style>
</head>

<body>
  <div class="app-container">
    
    <!-- Header -->
    <header class="app-header">
      <div class="app-logo">
        <img src="https://img1.pic.in.th/images/801439345_29245142551739950_6563487455271515285_n.jpg" alt="Logo">
        <div>
          <h1 class="app-title">ภารกิจรายวัน TO DO LIST</h1>
          <span style="font-size: 15px; opacity: 0.9;">(รองปลัดเทศบาล)</span>
        </div>
      </div>
      <div class="task-counter">
        <i class="bi bi-list-check me-1"></i> <span id="task-count">0</span> รายการ
      </div>
    </header>

    <div class="row g-4">
      <!-- Left Sidebar (Form & Calendar) -->
      <div class="col-xl-4 col-lg-5">
        
        <!-- Form Add Task -->
        <div class="form-container">
          <h3 class="form-title"><i class="bi bi-plus-circle-fill"></i> เพิ่มภารกิจใหม่</h3>
          
          <div class="row">
            <div class="col-12 col-sm-6">
              <div class="form-group">
                <label class="form-label fw-semibold text-muted mb-1" style="font-size:14px;">วันที่</label>
                <input id="todo-date" type="date" class="form-control" />
              </div>
            </div>
            <div class="col-12 col-sm-6">
              <div class="form-group">
                <label class="form-label fw-semibold text-muted mb-1" style="font-size:14px;">เวลา</label>
                <input id="todo-time" type="time" class="form-control" />
              </div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label fw-semibold text-muted mb-1" style="font-size:14px;">รายละเอียดภารกิจ</label>
            <textarea id="todo-name" class="form-control" rows="2" placeholder="พิมพ์รายละเอียดกิจกรรม..."></textarea>
          </div>
          
          <div class="form-group">
            <label class="form-label fw-semibold text-muted mb-1" style="font-size:14px;">ระดับความสำคัญ</label>
            <select id="todo-priority" class="form-select">
              <option value="กลาง">ปานกลาง (Medium)</option>
              <option value="สูง">สูง (High)</option>
              <option value="ต่ำ">ต่ำ (Low)</option>
            </select>
          </div>
          
          <div class="form-group mb-4">
            <label class="form-label fw-semibold text-muted mb-1" style="font-size:14px;">เอกสารแนบ (ถ้ามี)</label>
            <div class="file-upload-container">
              <label for="todo-file" class="custom-file-upload"><i class="bi bi-cloud-arrow-up"></i> เลือกไฟล์</label>
              <span class="file-name" id="file-name">ยังไม่ได้เลือกไฟล์</span>
              <input id="todo-file" type="file" class="d-none" onchange="updateFileName()" />
            </div>
          </div>
          
          <button class="submit-btn" onClick="addItem()">
            <i class="bi bi-save"></i> บันทึกภารกิจ
          </button>
        </div>

        <!-- Filter Calendar -->
        <div class="filter-container">
          <h3 class="filter-title"><i class="bi bi-calendar-check"></i> เลือกดูตามวันที่</h3>
          <div id="calendar-filter" class="calendar-container"></div>
          <button class="show-all-btn" onclick="renderTable()">
            <i class="bi bi-arrow-counterclockwise"></i> แสดงข้อมูลทั้งหมด
          </button>
        </div>
      </div>

      <!-- Right Main (Table) -->
      <div class="col-xl-8 col-lg-7">
        <div class="table-container">
          
          <!-- Loader -->
          <div class="loading-spinner" id="loading-spinner">
            <div class="spinner-border" role="status"></div>
            <div class="mt-3 fw-semibold text-muted">กำลังโหลดข้อมูล...</div>
          </div>

          <div class="table-responsive">
            <table class="table custom-table" id="todoTable">
              <thead class="custom-thead">
                <tr>
                  <th class="dtr-control-header"></th>
                  <th>วันที่</th>
                  <th>เวลา</th>
                  <th>ภาระงาน</th>
                  <th class="text-center">สถานะ</th>
                  <th class="text-center">ความสำคัญ</th>
                  <th class="text-center">ไฟล์</th>
                  <th class="text-center">จัดการ</th>
                </tr>
              </thead>
              <tbody class="todo-items">
                <!-- ข้อมูลจาก Script -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-pencil-square me-2"></i> แก้ไขภารกิจ</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="editForm">
            <input type="hidden" id="edit-id">
            <div class="row">
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="form-label fw-semibold text-muted mb-1" style="font-size:14px;">วันที่</label>
                  <input type="date" class="form-control" id="edit-date" required>
                </div>
              </div>
              <div class="col-12 col-sm-6">
                <div class="form-group">
                  <label class="form-label fw-semibold text-muted mb-1" style="font-size:14px;">เวลา</label>
                  <input type="time" class="form-control" id="edit-time" required>
                </div>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label fw-semibold text-muted mb-1" style="font-size:14px;">ภาระงาน</label>
              <textarea class="form-control" id="edit-name" rows="3" required></textarea>
            </div>
            <div class="form-group">
              <label class="form-label fw-semibold text-muted mb-1" style="font-size:14px;">ความสำคัญ</label>
              <select class="form-select" id="edit-priority">
                <option value="สูง">สูง (High)</option>
                <option value="กลาง">ปานกลาง (Medium)</option>
                <option value="ต่ำ">ต่ำ (Low)</option>
              </select>
            </div>
            <div class="form-group mb-0">
              <label class="form-label fw-semibold text-muted mb-1" style="font-size:14px;">เอกสารแนบ</label>
              <div class="file-upload-container">
                <label for="edit-file" class="custom-file-upload"><i class="bi bi-folder-symlink"></i> เปลี่ยนไฟล์</label>
                <span class="file-name" id="edit-file-name">ไม่มีไฟล์</span>
                <input id="edit-file" type="file" class="d-none" onchange="updateEditFileName()" />
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light rounded-3 px-4 fw-semibold" data-bs-dismiss="modal">ยกเลิก</button>
          <button type="button" class="submit-btn" style="width:auto;" onclick="saveModalItem()">บันทึกการแก้ไข</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // ==========================================
    // ตั้งค่า URL ของ API (นำ Web App URL มาใส่ที่นี่)
    // ==========================================
    const API_URL = 'https://script.google.com/macros/s/AKfycbzCexqXwlSFRp5Rp1wu8QjxtSQPXTUeF3y9MiliMZMOUTHtjrB2ivDJ1h9Kss6PWw22tw/exec';

    let currentData = [];
    let dataTable = null;
    let currentFilterDate = null;

    // ฟังก์ชันสื่อสารกับ Google Apps Script (Fetch API)
    async function callApi(action, data = {}) {
        if (API_URL === 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL') {
            throw new Error("กรุณาใส่ Web App URL ที่ตัวแปร API_URL ด้านบนของ Script");
        }
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: action, ...data })
            });
            const result = await response.json();
            if (result.status === 'success') return result.data;
            else throw new Error(result.message);
        } catch (error) {
            console.error("API Error:", error);
            throw error;
        }
    }

    // ==========================================
    // UI Helpers & Mobile Templates
    // ==========================================
    function createChildRowContent(item) {
        return `
            <div class="child-row-content">
                <div class="child-row-item">
                    <span class="child-row-label">ภาระงาน:</span>
                    <span class="child-row-value text-start">${item.name}</span>
                </div>
                <div class="child-row-item">
                    <span class="child-row-label">สถานะ:</span>
                    <span class="child-row-value">
                        <span class="status-badge ${item.checked ? 'status-yes' : 'status-no'}" 
                              onclick="toggleStatus('${item.id}', ${!item.checked})">
                            ${item.checked ? '<i class="bi bi-check-circle-fill me-1"></i> ดำเนินการแล้ว' : 'รอดำเนินการ'}
                        </span>
                    </span>
                </div>
                <div class="child-row-item">
                    <span class="child-row-label">ความสำคัญ:</span>
                    <span class="child-row-value">
                        <span class="priority-badge priority-${getPriorityClass(item.priority)}">
                            ${item.priority}
                        </span>
                    </span>
                </div>
                <div class="child-row-item">
                    <span class="child-row-label">ไฟล์แนบ:</span>
                    <span class="child-row-value">
                        ${item.note ? `<a href="${item.note}" target="_blank" class="action-btn file-btn"><i class="bi bi-box-arrow-up-right"></i></a>` : '-'}
                    </span>
                </div>
                <div class="child-actions">
                    <a href="#" class="action-btn edit-btn" onclick="openEditModal('${item.id}')"><i class="bi bi-pencil-fill"></i></a>
                    <a href="#" class="action-btn delete-btn" onclick="deleteItem('${item.id}')"><i class="bi bi-trash3-fill"></i></a>
                </div>
            </div>
        `;
    }

    // Datepicker Setup
    $(function() {
        $.datepicker.regional['th'] = {
            closeText: 'ปิด', prevText: 'ย้อน', nextText: 'ถัดไป', currentText: 'วันนี้',
            monthNames: ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน', 'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'],
            monthNamesShort: ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.', 'ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'],
            dayNames: ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'],
            dayNamesShort: ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'],
            dayNamesMin: ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'],
            weekHeader: 'Wk', dateFormat: 'yy-mm-dd', firstDay: 0, isRTL: false, showMonthAfterYear: false, yearSuffix: ''
        };
        $.datepicker.setDefaults($.datepicker.regional['th']);

        $("#calendar-filter").datepicker({
            dateFormat: 'yy-mm-dd',
            onSelect: function(dateText) { filterByDate(dateText); },
            beforeShowDay: function(date) {
                const dateString = $.datepicker.formatDate('yy-mm-dd', date);
                const hasData = currentData.some(item => item.date === dateString);
                return [true, hasData ? 'has-data' : '', ''];
            }
        });
    });

    function updateCalendarWithData() {
        setTimeout(() => { $("#calendar-filter").datepicker("refresh"); }, 100);
    }

    function showLoading() {
        document.getElementById('loading-spinner').style.display = 'flex';
        $('#todoTable').css('opacity', '0.4');
    }

    function hideLoading() {
        document.getElementById('loading-spinner').style.display = 'none';
        $('#todoTable').css('opacity', '1');
    }

    // ==========================================
    // Data Loading & Table Rendering
    // ==========================================
    async function loadDataFromSpreadsheet() {
        showLoading();
        currentFilterDate = null; 
        try {
            const items = await callApi('getAllItems');
            currentData = items || [];
            renderTableWithData(currentData);
            updateCalendarWithData();
        } catch (e) {
            handleError(e);
            useSampleData(); 
        } finally {
            hideLoading();
        }
    }

    async function filterByDate(date) {
        currentFilterDate = date;
        showLoading();
        try {
            const items = await callApi('getItemsByDate', { date: date });
            currentData = items || [];
            renderTableWithData(currentData);
        } catch (e) {
            handleError(e);
            const filtered = currentData.filter(item => item.date === date);
            renderTableWithData(filtered);
        } finally {
            hideLoading();
        }
    }

    function formatThaiDate(dateStr) {
        const months = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
        const date = new Date(dateStr);
        return `${date.getDate()} ${months[date.getMonth()]} ${(date.getFullYear() + 543).toString().substr(2,2)}`;
    }

    function setCurrentDate() {
        const now = new Date();
        document.getElementById('todo-date').value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        document.getElementById('todo-time').value = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    }

    function getPriorityClass(priority) {
        return priority === 'สูง' ? 'high' : priority === 'ต่ำ' ? 'low' : 'medium';
    }

    function renderTableWithData(items) {
        if (dataTable) dataTable.destroy();

        const tbody = document.querySelector('.todo-items');
        tbody.innerHTML = '';
        document.getElementById('task-count').textContent = items.length;
        
        items.forEach(item => {
            const hasFile = item.note && item.note.trim().length > 0;
            const tr = document.createElement('tr');
            
            tr.innerHTML = `
          <td class="dtr-control"></td>
          <td class="text-nowrap" data-order="${item.date}">${formatThaiDate(item.date)}</td>
          <td class="text-muted fw-semibold text-nowrap">${item.time}</td>
          <td>${item.name}</td>
          <td class="text-center">
            <span class="status-badge ${item.checked ? 'status-yes' : 'status-no'}" onclick="toggleStatus('${item.id}', ${!item.checked})">
                ${item.checked ? '<i class="bi bi-check-circle-fill me-1"></i> เรียบร้อย' : 'รอทำ'}
            </span>
          </td>
          <td class="text-center">
            <span class="priority-badge priority-${getPriorityClass(item.priority)}">${item.priority}</span>
          </td>
          <td class="text-center">
            ${hasFile ? `<a href="${item.note}" target="_blank" class="action-btn file-btn"><i class="bi bi-paperclip"></i></a>` : `<span class="action-btn file-btn" style="opacity:0.3; cursor:default;"><i class="bi bi-dash"></i></span>`}
          </td>
          <td class="text-center text-nowrap">
            <button class="action-btn edit-btn" onclick="openEditModal('${item.id}')"><i class="bi bi-pencil-fill"></i></button>
            <button class="action-btn delete-btn" onclick="deleteItem('${item.id}')"><i class="bi bi-trash3-fill"></i></button>
          </td>
`;
            tbody.appendChild(tr);
        });

        dataTable = $('#todoTable').DataTable({
            pageLength: 10,
            lengthMenu: [[10, 25, 50, -1], [10, 25, 50, "ทั้งหมด"]],
            language: {
                search: "", searchPlaceholder: "🔍 ค้นหาภารกิจ...", lengthMenu: "แสดง _MENU_ รายการ",
                info: "หน้า _PAGE_ จาก _PAGES_", infoEmpty: "ไม่มีข้อมูล", paginate: { previous: "«", next: "»" }, emptyTable: "ยังไม่มีภารกิจในวันนี้"
            },
            responsive: false, autoWidth: false, order: [[1, 'desc'], [2, 'desc']],
            columnDefs: [
                { targets: 0, orderable: false, className: 'dtr-control' },
                { targets: [4,5,6,7], orderable: false }
            ],
            drawCallback: function() { attachMobileEvents(); }
        });
    }

    function attachMobileEvents() {
        $('#todoTable tbody').off('click', 'td.dtr-control');
        if (window.innerWidth <= 767) {
            $('#todoTable tbody').on('click', 'td.dtr-control', function(e) {
                const tr = $(this).closest('tr');
                const row = dataTable.row(tr);
                
                if (row.child.isShown()) {
                    row.child.hide();
                    tr.removeClass('parent');
                } else {
                    const item = currentData[row.index()];
                    if(item) {
                        row.child(createChildRowContent(item)).show();
                        tr.addClass('parent');
                    }
                }
            });
        }
    }
    
    $(window).resize(() => attachMobileEvents());

    // ==========================================
    // CRUD Operations
    // ==========================================
    function toggleStatus(id, newStatus) {
        const item = currentData.find(i => i.id === id);
        if (!item) return;

        if (item.checked && !newStatus) {
            Swal.fire({
                title: 'ยืนยันรหัสป้องกัน', input: 'password', inputPlaceholder: 'ใส่รหัส (1234)',
                showCancelButton: true, confirmButtonText: 'ยืนยัน', cancelButtonText: 'ยกเลิก', confirmButtonColor: 'var(--primary)'
            }).then((res) => {
                if (res.isConfirmed && res.value === '1234') execUpdateStatus(id, newStatus);
                else if (res.isConfirmed) Swal.fire('ผิดพลาด', 'รหัสไม่ถูกต้อง', 'error');
            });
        } else {
            execUpdateStatus(id, newStatus);
        }
    }

    async function execUpdateStatus(id, newStatus) {
        try {
            await callApi('updateItemStatus', { id: id, checked: newStatus });
            const idx = currentData.findIndex(i => i.id === id);
            if (idx !== -1) currentData[idx].checked = newStatus;
            renderTableWithData(currentData);
        } catch(e) { 
            Swal.fire('ข้อผิดพลาด', 'ไม่สามารถอัพเดทสถานะได้', 'error');
        }
    }

    function addItem() {
        const name = document.getElementById('todo-name').value.trim();
        const date = document.getElementById('todo-date').value;
        const time = document.getElementById('todo-time').value;
        const priority = document.getElementById('todo-priority').value;
        const fileInput = document.getElementById('todo-file');

        if (!name || !date || !time) {
            Swal.fire({icon: 'warning', title: 'กรอกข้อมูลไม่ครบ', text: 'โปรดระบุรายละเอียด วันที่ และเวลา', confirmButtonColor: 'var(--primary)'});
            return;
        }

        Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        const newItem = { date, time, name, checked: false, priority, note: "", fileData: null, fileName: null };

        if (fileInput.files.length > 0) {
            const reader = new FileReader();
            reader.onload = e => {
                newItem.fileData = e.target.result;
                newItem.fileName = fileInput.files[0].name;
                saveToAppScript(newItem);
            };
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            saveToAppScript(newItem);
        }
    }

    async function saveToAppScript(item) {
        try {
            const res = await callApi('saveItem', { item: item });
            document.getElementById('todo-name').value = '';
            document.getElementById('todo-file').value = '';
            document.getElementById('file-name').textContent = 'ยังไม่ได้เลือกไฟล์';
            Swal.fire({icon: 'success', title: 'บันทึกสำเร็จ', showConfirmButton: false, timer: 1500});
            filterByDate(res.date); 
        } catch(e) {
            Swal.fire('ข้อผิดพลาด', e.message, 'error'); 
        }
    }

    function openEditModal(id) {
        const item = currentData.find(i => i.id === id);
        if(!item) return;
        document.getElementById('edit-id').value = item.id;
        document.getElementById('edit-date').value = item.date;
        document.getElementById('edit-time').value = item.time;
        document.getElementById('edit-name').value = item.name;
        document.getElementById('edit-priority').value = item.priority;
        document.getElementById('edit-file-name').textContent = item.note ? 'มีไฟล์เดิม' : 'ไม่มีไฟล์';
        new bootstrap.Modal(document.getElementById('editModal')).show();
    }

    function saveModalItem() {
        const id = document.getElementById('edit-id').value;
        const org = currentData.find(i => i.id === id);
        const item = {
            id, date: document.getElementById('edit-date').value, time: document.getElementById('edit-time').value,
            name: document.getElementById('edit-name').value.trim(), priority: document.getElementById('edit-priority').value,
            checked: org ? org.checked : false, note: org ? org.note : '', fileData: null, fileName: null
        };

        const fileInput = document.getElementById('edit-file');
        Swal.fire({ title: 'กำลังอัพเดท...', didOpen: () => Swal.showLoading() });

        if (fileInput.files.length > 0) {
            const reader = new FileReader();
            reader.onload = e => {
                item.fileData = e.target.result;
                item.fileName = fileInput.files[0].name;
                updateToAppScript(item);
            };
            reader.readAsDataURL(fileInput.files[0]);
        } else {
            updateToAppScript(item);
        }
    }

    async function updateToAppScript(item) {
        try {
            const res = await callApi('updateItem', { item: item });
            bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
            Swal.fire({icon: 'success', title: 'อัพเดทสำเร็จ', timer: 1500, showConfirmButton: false});
            filterByDate(res.date);
        } catch(e) { 
            Swal.fire('ข้อผิดพลาด', e.message, 'error');
        }
    }

    function deleteItem(id) {
        Swal.fire({
            title: 'ยืนยันการลบ?', text: "ข้อมูลนี้จะถูกลบและไม่สามารถกู้คืนได้",
            icon: 'warning', showCancelButton: true, confirmButtonColor: 'var(--danger)', confirmButtonText: 'ลบข้อมูล'
        }).then(async (res) => {
            if (res.isConfirmed) {
                Swal.fire({ title: 'กำลังลบ...', didOpen: () => Swal.showLoading() });
                try {
                    await callApi('deleteItemFromSheet', { id: id });
                    Swal.fire({icon:'success', title:'ลบเรียบร้อย', timer: 1500, showConfirmButton: false});
                    if (currentFilterDate) filterByDate(currentFilterDate);
                    else loadDataFromSpreadsheet();
                } catch(e) { 
                    Swal.fire('ข้อผิดพลาด', e.message, 'error');
                }
            }
        });
    }

    function updateFileName() {
        const file = document.getElementById('todo-file').files[0];
        document.getElementById('file-name').textContent = file ? file.name : 'ยังไม่ได้เลือกไฟล์';
    }
    
    function updateEditFileName() {
        const file = document.getElementById('edit-file').files[0];
        document.getElementById('edit-file-name').textContent = file ? file.name : 'ไม่มีไฟล์';
    }
    
    function renderTable() { loadDataFromSpreadsheet(); }

    function useSampleData() {
        currentData = [
            { id: "1", date: new Date().toISOString().split('T')[0], time: "09:30", name: "ประชุมติดตามความก้าวหน้า (ทดสอบ)", checked: false, priority: "สูง", note: "#" }
        ];
        renderTableWithData(currentData);
        updateCalendarWithData();
    }
    
    function handleError(error) {
        console.error("System Error:", error);
        Swal.fire({icon: 'error', title: 'การเชื่อมต่อผิดพลาด', text: 'ไม่สามารถโหลดข้อมูลจากเซิร์ฟเวอร์ได้'});
    }

    document.addEventListener('DOMContentLoaded', () => {
        setCurrentDate();
        loadDataFromSpreadsheet();
    });

  </script>
</body>
</html>
